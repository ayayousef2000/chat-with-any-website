# Render Blueprint: describes the two web services of this repository so that they can be created from it.
# Secrets are not stored here: Render asks for them only when a Blueprint is first created, so the secrets of a
# service added later must be entered in its Environment tab (sync: false).
#
#   staging     deploys the develop branch on every merge, to try changes before a release
#   production  deploys the main branch, which only changes when a release is merged
#
# The Blueprint is linked to the main branch, so a change to this file takes effect after a release.
#
# Both services use the same Weaviate collection, each with its own tenant. A free Weaviate Cloud plan allows one
# collection and three tenants, and Weaviate keeps the tenants apart: an app deletes the pages it finds in its own
# tenant when nobody has asked about them for a while, which must never reach the pages of another service.
services:
  - type: web
    name: chat-with-any-website
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Frankfurt is close to the Weaviate Cloud cluster in eu-central-1.
    region: frankfurt
    plan: free
    # Deploy the released branch only, so that every push to develop does not reach visitors.
    branch: main
    autoDeployTrigger: commit
    # Answers at once and calls no outside service (see app/main.py).
    healthCheckPath: /health
    envVars:
      - key: WEAVIATE_COLLECTION
        value: WebsiteChunk
      - key: WEAVIATE_TENANT
        value: production
      # The addresses the app trusts to say who the visitor is, so that the limits per visitor are counted per visitor.
      # The app is reached through a local proxy (127.0.0.1), Render's internal range and Cloudflare's published
      # addresses (https://www.cloudflare.com/ips/). Uvicorn reads the forwarded header from the right, skips these
      # trusted addresses and takes the first other one: the visitor. Anything a caller puts in the header sits to
      # the left of the visitor, so it cannot change the result. Checked on Render on 2026-10-10 (see the README).
      - key: FORWARDED_ALLOW_IPS
        value: "127.0.0.1,::1,10.0.0.0/8,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      - key: COHERE_API_KEY
        sync: false
      - key: WEAVIATE_URL
        sync: false
      - key: WEAVIATE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Optional: more Groq keys, separated by commas. Leave empty to use only GROQ_API_KEY.
      - key: GROQ_BACKUP_API_KEYS
        sync: false

  - type: web
    name: chat-with-any-website-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    # Every merge into develop is deployed here, so a change can be tried before it is released.
    branch: develop
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: WEAVIATE_COLLECTION
        value: WebsiteChunk
      - key: WEAVIATE_TENANT
        value: staging
      # The addresses the app trusts to say who the visitor is, so that the limits per visitor are counted per visitor.
      # The app is reached through a local proxy (127.0.0.1), Render's internal range and Cloudflare's published
      # addresses (https://www.cloudflare.com/ips/). Uvicorn reads the forwarded header from the right, skips these
      # trusted addresses and takes the first other one: the visitor. Anything a caller puts in the header sits to
      # the left of the visitor, so it cannot change the result. Checked on Render on 2026-10-10 (see the README).
      - key: FORWARDED_ALLOW_IPS
        value: "127.0.0.1,::1,10.0.0.0/8,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      - key: COHERE_API_KEY
        sync: false
      - key: WEAVIATE_URL
        sync: false
      - key: WEAVIATE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BACKUP_API_KEYS
        sync: false
