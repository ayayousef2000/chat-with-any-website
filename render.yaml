# Render Blueprint: describes the two web services of this repository so that they can be created from it.
# Secrets are not stored here: Render asks for them only when a Blueprint is first created, so the secrets of a
# service added later must be entered in its Environment tab (sync: false).
#
#   staging     deploys the develop branch on every merge, to try changes before a release
#   production  deploys the main branch, which only changes when a release is merged
#
# The Blueprint is linked to the main branch, so a change to this file takes effect after a release.
#
# Both services use the same Weaviate collection, each with its own tenant. A free Weaviate Cloud plan allows one
# collection and three tenants, and Weaviate keeps the tenants apart: an app deletes the pages it finds in its own
# tenant when nobody has asked about them for a while, which must never reach the pages of another service.
services:
  - type: web
    name: chat-with-any-website
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Frankfurt is close to the Weaviate Cloud cluster in eu-central-1.
    region: frankfurt
    plan: free
    # Deploy the released branch only, so that every push to develop does not reach visitors.
    branch: main
    autoDeployTrigger: commit
    # Answers at once and calls no outside service (see app/main.py).
    healthCheckPath: /health
    envVars:
      - key: WEAVIATE_COLLECTION
        value: WebsiteChunk
      - key: WEAVIATE_TENANT
        value: production
      - key: COHERE_API_KEY
        sync: false
      - key: WEAVIATE_URL
        sync: false
      - key: WEAVIATE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Optional: more Groq keys, separated by commas. Leave empty to use only GROQ_API_KEY.
      - key: GROQ_BACKUP_API_KEYS
        sync: false

  - type: web
    name: chat-with-any-website-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    # Every merge into develop is deployed here, so a change can be tried before it is released.
    branch: develop
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: WEAVIATE_COLLECTION
        value: WebsiteChunk
      - key: WEAVIATE_TENANT
        value: staging
      - key: COHERE_API_KEY
        sync: false
      - key: WEAVIATE_URL
        sync: false
      - key: WEAVIATE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BACKUP_API_KEYS
        sync: false
