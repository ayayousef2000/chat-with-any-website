name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    # Weekly run so newly published vulnerabilities in dependencies are noticed without a code change.
    - cron: "17 5 * * 1"

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.22"

jobs:
  lint:
    name: Compile, lint, format and types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Compile
        run: uv run python -m compileall -q app eval tests
      - name: Lint
        run: uv run poe lint
      - name: Format
        run: uv run poe format
      - name: Types
        run: uv run poe types

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run poe test

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv build
      - name: Smoke test the built wheel
        run: uv run --no-project --isolated --with dist/*.whl python -c "import app.main"
        env:
          COHERE_API_KEY: ci
          WEAVIATE_URL: https://ci.invalid
          WEAVIATE_API_KEY: ci
          GROQ_API_KEY: ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag chat-with-any-website:ci .
      - name: Smoke test the image
        run: |
          docker run --rm --interactive --env COHERE_API_KEY=ci --env WEAVIATE_URL=https://ci.invalid --env WEAVIATE_API_KEY=ci --env GROQ_API_KEY=ci chat-with-any-website:ci python - <<'PY'
          import importlib.util
          import os

          from app.main import STATIC_DIR

          assert (STATIC_DIR / "index.html").is_file(), "the page files are missing from the image"
          assert os.getuid() != 0, "the image runs as root"
          for tool in ("pytest", "mypy", "ruff"):
              assert importlib.util.find_spec(tool) is None, f"{tool} is in the image"
          print("the image looks right")
          PY
      - name: Check that no local or secret files are in the image
        run: >-
          docker run --rm chat-with-any-website:ci
          sh -c 'test ! -e /app/.env && test ! -e /app/docs && test ! -e /app/tests && test ! -e /app/CLAUDE.md'

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Export locked dependencies
        run: uv export --locked --all-extras --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      # PYSEC-2026-3740 (nltk, reached only through the optional "browser" extra) has no fixed release yet and
      # concerns loading model files from caller-supplied paths, which this project never does.
      # Remove the ignore once nltk publishes a fix.
      - name: Audit for known vulnerabilities
        run: >-
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
          --ignore-vuln PYSEC-2026-3740

  page:
    name: Page script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node --test tests/js/*.test.js

  workflows:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Audit workflows
        run: uvx zizmor@1.30.1 --offline .github

  # Single required status check: it passes only if every job above succeeded.
  ci-gate:
    name: CI passed
    if: always()
    needs: [lint, test, page, build, docker, audit, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all jobs to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
