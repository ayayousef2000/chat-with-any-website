[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "chat-with-any-website"
version = "0.1.0"
description = "Ask questions about any web page using retrieval-augmented generation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cohere>=7.2.0",
    "fastapi>=0.142.2",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "trafilatura>=2.3.0",
    "uvicorn[standard]>=0.54.0",
    "weaviate-client>=4.23.1",
]

[project.optional-dependencies]
browser = [
    "crawl4ai>=0.9.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "S",       # security (bandit)
    "C4",      # comprehensions
    "SIM",     # simplifications
    "PT",      # pytest style
    "RUF",     # ruff-specific
    "D",       # docstrings
]
ignore = [
    "D105",  # magic methods
    "D107",  # __init__ (documented on the class)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S104"]
"eval/**" = ["E402"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "eval", "tests"]

[[tool.mypy.overrides]]
module = ["crawl4ai", "crawl4ai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    # Raised by an upstream dependency of weaviate-client, not by this project.
    "ignore:The httpx module is deprecated:DeprecationWarning",
    "ignore:.asyncio.iscoroutinefunction. is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80

[tool.poe.tasks]
types = "mypy"
lint = "ruff check ."
format = "ruff format --check ."
test = "pytest --cov --cov-report=term-missing:skip-covered"
fix = ["fix-lint", "fix-format"]
fix-lint = "ruff check --fix ."
fix-format = "ruff format ."
check = ["types", "lint", "format", "test"]
