<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat With Any Website</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1b1f24;
      --muted: #5f6b7a;
      --border: #dde1e6;
      --accent: #4f5bd5;
      --accent-text: #ffffff;
      --user-bubble: #e8eafc;
      --error: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --surface: #1a1e24;
        --text: #e6e9ee;
        --muted: #98a2b0;
        --border: #2c323a;
        --accent: #7c86f0;
        --accent-text: #0e1014;
        --user-bubble: #262c4a;
        --error: #ff6b5e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .subtitle { margin: 4px 0 0; color: var(--muted); }
    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font: inherit;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button {
      padding: 10px 16px;
      font: inherit;
      font-weight: 600;
      color: var(--accent-text);
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .status { min-height: 1.5em; margin: 0; color: var(--muted); font-size: 0.9rem; }
    .status.error { color: var(--error); }
    #messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow-y: auto;
      min-height: 320px;
    }
    .empty { margin: auto; color: var(--muted); text-align: center; }
    .message { max-width: 90%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message.user { align-self: flex-end; background: var(--user-bubble); }
    .message.assistant { align-self: flex-start; border: 1px solid var(--border); }
    .message.error { color: var(--error); }
    details { margin-top: 8px; font-size: 0.85rem; color: var(--muted); white-space: normal; }
    summary { cursor: pointer; }
    .source { margin: 8px 0 0; padding: 8px; border-left: 3px solid var(--border); white-space: pre-wrap; }
    .source.highlight { border-left-color: var(--accent); background: var(--user-bubble); }
    button.cite {
      padding: 0 5px;
      margin: 0 1px;
      font-size: 0.8em;
      font-weight: 600;
      color: var(--accent);
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 6px;
    }
    button.cite:hover, button.cite:focus-visible { color: var(--accent-text); background: var(--accent); }
    @media (max-width: 520px) {
      form { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Chat With Any Website</h1>
      <p class="subtitle">Load a web page, then ask questions about its content.</p>
    </header>

    <form id="ingest-form">
      <input id="url" type="text" inputmode="url" placeholder="https://example.com/article" required autocomplete="url">
      <button id="ingest-button" type="submit">Load page</button>
    </form>
    <p id="status" class="status" role="status"></p>

    <section id="messages" aria-live="polite">
      <p class="empty">No page loaded yet.</p>
    </section>

    <form id="ask-form">
      <input id="question" type="text" placeholder="Ask a question about the page" required disabled>
      <button id="ask-button" type="submit" disabled>Ask</button>
    </form>
  </main>

  <script>
    const ingestForm = document.getElementById("ingest-form");
    const askForm = document.getElementById("ask-form");
    const urlInput = document.getElementById("url");
    const questionInput = document.getElementById("question");
    const ingestButton = document.getElementById("ingest-button");
    const askButton = document.getElementById("ask-button");
    const statusEl = document.getElementById("status");
    const messagesEl = document.getElementById("messages");

    let activeUrl = null;

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.classList.toggle("error", isError);
    }

    function setAskEnabled(enabled) {
      questionInput.disabled = !enabled;
      askButton.disabled = !enabled;
    }

    async function postJson(path, payload) {
      const response = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const detail = Array.isArray(data.detail) ? data.detail.map((d) => d.msg).join("; ") : data.detail;
        throw new Error(detail || `Request failed with status ${response.status}`);
      }
      return data;
    }

    // Builds the collapsible source list. Clicking a citation shows only that source; clicking the
    // "Sources" line shows all of them.
    function buildSources(sources) {
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      details.append(summary);

      const items = new Map();
      let only = null; // the source number currently shown alone, or null for all

      function render() {
        summary.textContent =
          only === null ? `Sources (${sources.length})` : `Sources (${sources.length}) · showing [${only}] only`;
        items.forEach((item, number) => {
          item.hidden = only !== null && number !== only;
        });
      }

      sources.forEach((source) => {
        const item = document.createElement("p");
        item.className = "source";
        item.textContent = `[${source.number}] ${source.heading ? source.heading + ": " : ""}${source.text}`;
        details.append(item);
        items.set(source.number, item);
      });

      summary.addEventListener("click", (event) => {
        event.preventDefault();
        if (details.open && only === null) {
          details.open = false;
        } else {
          only = null;
          details.open = true;
          render();
        }
      });

      function showOnly(number) {
        if (details.open && only === number) {
          only = null;
          details.open = false;
          render();
          return;
        }
        only = number;
        details.open = true;
        render();
        const item = items.get(number);
        item.scrollIntoView({ block: "nearest", behavior: "smooth" });
        item.classList.add("highlight");
        setTimeout(() => item.classList.remove("highlight"), 1600);
      }

      render();
      return { details, showOnly, has: (number) => items.has(number) };
    }

    // Turns "[2]" markers in the answer into buttons that show the matching source.
    function renderAnswer(container, text, sourceList) {
      text.split(/(\[\d+\])/).forEach((part) => {
        const number = Number(part.slice(1, -1));
        if (!/^\[\d+\]$/.test(part) || !sourceList.has(number)) {
          container.append(part);
          return;
        }
        const button = document.createElement("button");
        button.type = "button";
        button.className = "cite";
        button.textContent = part;
        button.setAttribute("aria-label", `Show source ${number}`);
        button.addEventListener("click", () => sourceList.showOnly(number));
        container.append(button);
      });
    }

    function addMessage(role, text, sources = []) {
      messagesEl.querySelector(".empty")?.remove();
      const el = document.createElement("div");
      el.className = `message ${role}`;

      if (sources.length) {
        const sourceList = buildSources(sources);
        const answerEl = document.createElement("span");
        renderAnswer(answerEl, text, sourceList);
        el.append(answerEl, sourceList.details);
      } else {
        el.textContent = text;
      }

      messagesEl.append(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    ingestForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      ingestButton.disabled = true;
      setAskEnabled(false);
      setStatus("Fetching, cleaning, chunking and embedding the page…");
      try {
        const result = await postJson("/api/ingest", { url: urlInput.value });
        activeUrl = result.url;
        urlInput.value = result.url;
        messagesEl.replaceChildren();
        setStatus(`Loaded "${result.title}" (${result.chunk_count} chunks). Ask away.`);
        setAskEnabled(true);
        questionInput.focus();
      } catch (error) {
        setStatus(error.message, true);
        setAskEnabled(activeUrl !== null);
      } finally {
        ingestButton.disabled = false;
      }
    });

    askForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = questionInput.value.trim();
      if (!question || !activeUrl) return;

      addMessage("user", question);
      questionInput.value = "";
      setAskEnabled(false);
      setStatus("Thinking…");
      try {
        const result = await postJson("/api/ask", { url: activeUrl, question });
        addMessage("assistant", result.answer, result.sources);
        setStatus("");
      } catch (error) {
        addMessage("assistant error", error.message);
        setStatus("");
      } finally {
        setAskEnabled(true);
        questionInput.focus();
      }
    });
  </script>
</body>
</html>
