<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Chat With Any Website</title>
  <link rel="icon" href="/static/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main>
    <header>
      <h1><img src="/static/favicon.svg?v=2" alt="" width="40" height="40">Chat With Any Website</h1>
      <p class="subtitle">Load a web page, then ask questions about its content.</p>
    </header>

    <div class="load">
      <form id="ingest-form">
        <label for="url" class="sr-only">Web page address</label>
        <input id="url" type="text" inputmode="url" placeholder="https://example.com/article" required
               maxlength="2048" autocomplete="url" autocapitalize="off" spellcheck="false">
        <button id="ingest-button" type="submit">Load page</button>
      </form>
      <p id="status" class="status" role="status"></p>
    </div>

    <div id="page-bar" class="page-bar" hidden>
      <span class="page-bar-text">
        Chatting with <a id="page-link" target="_blank" rel="noopener noreferrer"></a>
        <span id="page-meta" class="muted"></span>
      </span>
      <button id="new-chat" type="button" class="secondary">New chat</button>
    </div>

    <section id="messages" role="log" aria-label="Conversation" aria-live="polite"></section>

    <form id="ask-form">
      <label for="question" class="sr-only">Your question</label>
      <input id="question" type="text" placeholder="Ask a question about the page" required maxlength="2000"
             autocomplete="off" disabled>
      <button id="ask-button" type="submit" disabled>Ask</button>
    </form>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
